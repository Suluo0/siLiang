name: quality-gates

on:
  push:
    branches: [main, master, develop, "codex/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-jwt-secret-32-chars-minimum-aaaaaa
  TS_DS_APIKEY: ci-mock-key
  API_ADDRESS: https://mock.local
  API_MODEL: mock-model

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: .venv/bin/ruff check src tests

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt pytest-cov==7.1.0 pytest-mock==3.15.1 pytest-timeout==2.4.0
      - name: Unit tests and coverage
        run: >-
          .venv/bin/python -m pytest -m unit
          --cov=src --cov-report=xml --cov-report=term-missing:skip-covered
          --junitxml=junit-unit.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            junit-unit.xml
            coverage.xml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d topic_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/topic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt pytest-cov==7.1.0 pytest-mock==3.15.1 pytest-timeout==2.4.0
      - name: Integration tests
        run: .venv/bin/python -m pytest -m integration --junitxml=junit-integration.xml -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: junit-integration.xml

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: siliang-app:ci

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
