[tool.poetry]
name = "topicsystem"
version = "0.2.0"
description = "AI-Powered Interview Question Generation System with Agent Loop"
authors = ["xunsu"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = ">=0.43.0"
tortoise-orm = ">=0.24.0"
aerich = ">=0.7.0"
pydantic = ">=2.0"
pydantic-settings = ">=2.13.0"
python-dotenv = ">=1.2.0"

# Agent Framework
langgraph = ">=0.2.0"
langchain = ">=0.3.0"
langchain-openai = ">=0.3.0"
langchain-community = ">=0.3.0"

# Vector Database
pymilvus = ">=2.4.0"

# Embedding
sentence-transformers = ">=3.0.0"

# Async & Messaging
aio-pika = ">=9.4.0"

# Tracing
opentelemetry-api = ">=1.20"
opentelemetry-sdk = ">=1.20"
opentelemetry-exporter-otlp = ">=1.20"
langfuse = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
pytest-cov = ">=6.0"
pytest-mock = ">=3.14"
pytest-timeout = ">=2.3"
httpx = ">=0.27"
ruff = ">=0.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
norecursedirs = ["tests/_archive", ".venv", ".git", "node_modules", "TOPICSYSTEM_Web", "relay-server"]
# 默认只跑无外部依赖的单元测试；其他层级必须显式选择。
addopts = "-v --tb=short -m unit --strict-markers"
markers = [
    "unit: 纯逻辑单元测试(无外部依赖)",
    "integration: DB + HTTP 集成测试",
    "e2e: 全链路真实调用(LLM/Milvus/真实 API)",
    "slow: 慢速测试",
    "security: 安全边界与攻击回归测试",
    "concurrency: 竞态、幂等与多 worker 测试",
    "fault: 外部依赖故障注入与恢复测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:tortoise.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.ruff.lint.per-file-ignores]
# Tortoise 反向关系使用运行时解析的字符串前向声明。
"src/models/interview_room.py" = ["F821"]
"src/models/topic.py" = ["F821"]
"src/models/user.py" = ["F821"]
# 该文件的 e2e 段在条件化测试数据之后导入。
"tests/test_agentv3.py" = ["E402"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "scripts/*",
    "**/__pycache__/*",
    "src/**/migrations/*",
    "src/main.py",  # 启动文件,e2e 才覆盖
]

[tool.coverage.report]
fail_under = 40  # 纯 unit 基线 40.33%；只允许随整改上调，不得下降
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "src.config.aerich_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
